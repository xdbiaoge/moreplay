name: Backfill MorePlay 2.8.2 and 2.8.3 Releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-moreplay-282-283.yml"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Publish missing public tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          anchor_sha="30be524c1517792395e9bf9b4bdcc179a5462fbf"

          cat > /tmp/2.8.2.md <<'EOF'
          ## 更新说明

          1. 修复还有部分夸克原画线路播放失败

          ## 使用与升级

          - 对应 Docker 镜像：`mobai1231/catpawopen-fw:2.8.2`。
          - 升级前备份配置和媒体目录，重新创建容器时保留原 `/data`、`/strm` 挂载；本地猫源也需保留对应文件。
          EOF

          cat > /tmp/2.8.3.md <<'EOF'
          ## 更新说明

          1. 修复夸克原画。

          ## 使用与升级

          - 对应 Docker 镜像：`mobai1231/catpawopen-fw:2.8.3`。
          - 升级前备份配置和媒体目录，重新创建容器时保留原 `/data`、`/strm` 挂载；本地猫源也需保留对应文件。
          EOF

          publish_if_missing() {
            local tag="$1"
            local title="$2"
            local notes="$3"

            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                --raw-field "ref=refs/tags/${tag}" \
                --raw-field "sha=${anchor_sha}" >/dev/null
              echo "Created tag ${tag} at ${anchor_sha}"
            else
              echo "Tag ${tag} already exists; leaving unchanged"
            fi

            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
              echo "Release ${tag} already exists; leaving unchanged"
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
                --raw-field "tag_name=${tag}" \
                --raw-field "target_commitish=${anchor_sha}" \
                --raw-field "name=${title}" \
                --raw-field "body=$(cat "${notes}")" \
                -F draft=false \
                -F prerelease=false >/dev/null
              echo "Published release ${tag}"
            fi
          }

          publish_if_missing "v2.8.2" "MorePlay 2.8.2" "/tmp/2.8.2.md"
          publish_if_missing "v2.8.3" "MorePlay 2.8.3" "/tmp/2.8.3.md"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v2.8.2" --jq '"2.8.2: " + .html_url'
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v2.8.3" --jq '"2.8.3: " + .html_url'
