name: "✨ 功能建议"
description: "提出功能需求、兼容性改进或使用体验建议"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出改进建议。请先搜索现有 Issue，避免重复反馈。
  - type: dropdown
    id: module
    attributes:
      label: "涉及模块"
      options:
        - "Web 管理台"
        - "猫源 / 站源"
        - "Forward / Rex"
        - "Emby"
        - "STRM"
        - "T4 / TVBox"
        - "Docker / 部署"
        - "其他"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "当前遇到的问题"
      description: "说明现有功能有什么限制，以及为什么需要改进"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "希望增加或调整的功能"
      description: "尽可能描述预期的操作过程和使用效果"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "备选方案或补充说明"
      description: "可选。已有替代方式、界面示意、兼容性要求等"
    validations:
      required: false
